---
# ──────────────────────────────────────────────────────────────────────────────
# FlexStack Benchmarking — Setup Playbook
# ──────────────────────────────────────────────────────────────────────────────
#
# Installs all benchmark dependencies on remote hosts:
#   1. Syncs project files (python/, scripts/, certs/ dirs)
#   2. Creates a CPython venv and installs Python requirements
#   3. Downloads and installs PyPy 3.11 with Python requirements
#   4. Installs the Rust benchmark binary (musl static)
#   5. Syncs certificate chain (COER certs + raw/PEM keys) to remote hosts
#
# Python packages: python/requirements.txt (v2xflexstack pinned, from PyPI).
# artifact_source (inventory.yml) selects the Rust harness and certificates:
#   local    (default) built on the controller by scripts/prepare_campaign.sh
#            into ../dist/ (harness against the rustflexstack of
#            rust/Cargo.lock, certificates made with the pinned FlexStack,
#            MANIFEST.txt, copied to every host and next to the results);
#   release  the harness binary of the GitHub release rust_release_tag and
#            ../certs/.
#
# Usage:
#   ansible-playbook -i inventory.yml setup.yml
#   ansible-playbook -i inventory.yml setup.yml --tags cpython    # only CPython
#   ansible-playbook -i inventory.yml setup.yml --tags pypy       # only PyPy
#   ansible-playbook -i inventory.yml setup.yml --tags rust       # only Rust binary
#   ansible-playbook -i inventory.yml setup.yml --tags certs      # only certificates
# ──────────────────────────────────────────────────────────────────────────────

- name: Setup FlexStack Benchmarking environment
  hosts: all
  become: false

  vars:
    # Derived paths
    project_src: "{{ playbook_dir }}/.."
    venv_dir: "{{ bench_dir }}/venv"
    pypy_dir: "{{ bench_dir }}/pypy"
    rust_bin: "{{ bench_dir }}/rust/target/release/flexstack-bench"

    # Architecture-dependent URLs
    pypy_urls:
      x86_64: "https://downloads.python.org/pypy/{{ pypy_version }}-linux64.tar.bz2"
      aarch64: "https://downloads.python.org/pypy/{{ pypy_version }}-aarch64.tar.bz2"

    rust_bin_names:
      x86_64: "flexstack-bench-x86_64-linux"
      aarch64: "flexstack-bench-aarch64-linux"

  tasks:
    # ── Clean slate ────────────────────────────────────────────────────────
    - name: Remove existing benchmark directory (permission-safe)
      become: true
      file:
        path: "{{ bench_dir }}"
        state: absent
      # -e setup_clean=false keeps the folder (and any results in it), e.g. to
      # add the Vanetza bundle with --tags vanetza while a campaign runs.
      when: setup_clean | default(true) | bool
      tags: [always]

    # ── Project files ──────────────────────────────────────────────────────
    - name: Create benchmark directory structure
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ bench_dir }}"
        - "{{ bench_dir }}/python"
        - "{{ bench_dir }}/scripts"
        - "{{ bench_dir }}/certs"
        - "{{ bench_dir }}/results"
        - "{{ bench_dir }}/rust/target/release"
      tags: [always]

    - name: Sync Python benchmark files
      copy:
        src: "{{ project_src }}/python/"
        dest: "{{ bench_dir }}/python/"
        mode: "0644"
      tags: [always]

    - name: Sync orchestrator scripts
      copy:
        src: "{{ project_src }}/scripts/"
        dest: "{{ bench_dir }}/scripts/"
        mode: "0755"
      tags: [always]

    # ── CPython venv ───────────────────────────────────────────────────────
    - name: Install python3-venv package (Debian/Ubuntu)
      become: true
      command:
        cmd: apt-get install -y python3-venv python3-pip python3-setuptools
      when: ansible_os_family == "Debian"
      changed_when: false
      tags: [cpython]

    - name: Create CPython virtual environment
      command:
        cmd: "{{ bench_python | default('python3') }} -m venv {{ venv_dir }}"
        creates: "{{ venv_dir }}/bin/python3"
      tags: [cpython]

    - name: Check the local campaign artefacts (scripts/prepare_campaign.sh)
      delegate_to: localhost
      run_once: true
      stat:
        path: "{{ project_src }}/dist/MANIFEST.txt"
      register: dist_manifest
      when: artifact_source == 'local'
      tags: [always]

    - name: Fail without local artefacts
      fail:
        msg: "artifact_source=local needs ../dist/: run scripts/prepare_campaign.sh on the controller first."
      when: artifact_source == 'local' and not dist_manifest.stat.exists
      tags: [always]

    - name: Sync the campaign MANIFEST
      copy:
        src: "{{ project_src }}/dist/MANIFEST.txt"
        dest: "{{ bench_dir }}/MANIFEST.txt"
        mode: "0644"
      when: artifact_source == 'local'
      tags: [always]

    - name: Install Python requirements in CPython venv (PyPI)
      pip:
        requirements: "{{ bench_dir }}/python/requirements.txt"
        virtualenv: "{{ venv_dir }}"
        virtualenv_command: "{{ bench_python | default('python3') }} -m venv"
      tags: [cpython]

    # ── PyPy 3.11 ──────────────────────────────────────────────────────────
    - name: Detect host architecture
      set_fact:
        host_arch: "{{ ansible_architecture }}"
      tags: [pypy, rust, vanetza]

    - name: Set PyPy download URL for architecture
      set_fact:
        pypy_url: "{{ pypy_urls[host_arch] }}"
      tags: [pypy]

    - name: Determine PyPy archive filename
      set_fact:
        pypy_archive: "{{ pypy_url | basename }}"
        pypy_extract_name: "{{ pypy_version }}-{{ 'linux64' if host_arch == 'x86_64' else 'aarch64' }}"
      tags: [pypy]

    - name: Download PyPy archive
      command:
        cmd: wget -q -O "/tmp/{{ pypy_archive }}" "{{ pypy_url }}"
      args:
        creates: "/tmp/{{ pypy_archive }}"
      tags: [pypy]

    - name: Remove old PyPy installation if present
      file:
        path: "{{ pypy_dir }}"
        state: absent
      tags: [pypy]

    - name: Extract PyPy archive
      unarchive:
        src: "/tmp/{{ pypy_archive }}"
        dest: "/tmp/"
        remote_src: true
      tags: [pypy]

    - name: Move extracted PyPy to project directory
      command:
        cmd: mv "/tmp/{{ pypy_extract_name }}" "{{ pypy_dir }}"
      tags: [pypy]

    - name: Ensure PyPy ensurepip is available
      command:
        cmd: "{{ pypy_dir }}/bin/pypy3 -m ensurepip --upgrade"
      changed_when: true
      tags: [pypy]

    - name: Install Python requirements in PyPy (PyPI)
      command:
        cmd: "{{ pypy_dir }}/bin/pypy3 -m pip install -r {{ bench_dir }}/python/requirements.txt"
      changed_when: true
      tags: [pypy]

    - name: Clean up PyPy archive
      file:
        path: "/tmp/{{ pypy_archive }}"
        state: absent
      tags: [pypy]

    # ── Rust binary ────────────────────────────────────────────────────────
    - name: Set Rust binary download URL
      set_fact:
        rust_bin_url: "{{ rust_release_base }}/{{ rust_bin_names[host_arch] }}"
      tags: [rust]

    - name: Download Rust benchmark binary from GitHub release (release)
      command:
        cmd: curl -L -f -o "{{ rust_bin }}" "{{ rust_bin_url }}"
      when: artifact_source != 'local'
      tags: [rust]

    - name: Copy Rust benchmark binary built by prepare_campaign.sh (local)
      copy:
        src: "{{ project_src }}/dist/bin/{{ rust_bin_names[host_arch] }}"
        dest: "{{ rust_bin }}"
        mode: "0755"
      when: artifact_source == 'local'
      tags: [rust]

    - name: Make Rust benchmark binary executable
      file:
        path: "{{ rust_bin }}"
        mode: "0755"
      tags: [rust]

    # ── Vanetza benchmark bundle (WP-D, vanetza/build.sh) ─────────────────
    - name: Check the Vanetza bundle for this architecture
      delegate_to: localhost
      stat:
        path: "{{ project_src }}/dist/vanetza/{{ host_arch }}/run.sh"
      register: vanetza_bundle
      tags: [vanetza]

    - name: Copy the Vanetza benchmark bundle
      copy:
        src: "{{ project_src }}/dist/vanetza/{{ host_arch }}/"
        dest: "{{ bench_dir }}/vanetza/"
        mode: preserve
      when: vanetza_bundle.stat.exists
      tags: [vanetza]

    # ── Certificates ───────────────────────────────────────────────────────
    # Certs are generated once locally using the Rust generate_certificate_chain
    # example from rustflexstack 0.3.0 (COER-compatible). The certs/ directory
    # must contain:
    #   - .cert files: COER-encoded IEEE 1609.2 certificates
    #   - .key files: raw 32-byte P-256 scalars (for Rust's import_signing_key)
    #   - .pem files: PEM-encoded private keys (for Python's import_signing_key)
    # Do NOT create .key from .pem — they are different formats.
    - name: Sync certificate chain to remote host
      copy:
        src: "{{ project_src }}/{{ 'dist/certs/' if artifact_source == 'local' else 'certs/' }}"
        dest: "{{ bench_dir }}/certs/"
        mode: "0600"
      tags: [certs]

    # Certs note:
    # - .cert files: COER-encoded IEEE 1609.2 certificates (generated by the Rust
    #   generate_certificate_chain example from rustflexstack 0.3.0)
    # - .key files: raw 32-byte P-256 scalars (for Rust's import_signing_key)
    # - .pem files: PEM-encoded private keys (for Python's import_signing_key)
    # Do NOT create .key from .pem — they are now different formats.

    # ── Verification ───────────────────────────────────────────────────────
    - name: Verify CPython venv
      command:
        cmd: "{{ venv_dir }}/bin/python3 -c 'import importlib.metadata as m; print(\"v2xflexstack\", m.version(\"v2xflexstack\"))'"
      register: cpython_check
      changed_when: false
      tags: [cpython, verify]

    - name: Verify PyPy installation
      command:
        cmd: "{{ pypy_dir }}/bin/pypy3 -c 'import importlib.metadata as m; print(\"v2xflexstack\", m.version(\"v2xflexstack\"))'"
      register: pypy_check
      changed_when: false
      tags: [pypy, verify]

    - name: Verify Rust binary
      command:
        cmd: "{{ rust_bin }} --help"
      register: rust_check
      changed_when: false
      tags: [rust, verify]

    - name: Verify certificates exist
      stat:
        path: "{{ bench_dir }}/certs/root_ca.cert"
      register: cert_check
      tags: [certs, verify]

    - name: Print setup summary
      debug:
        msg: |
          ═══════════════════════════════════════════════════════
          Setup complete on {{ inventory_hostname }}
          ═══════════════════════════════════════════════════════
            CPython : {{ cpython_check.stdout | default('NOT CHECKED') }}
            PyPy    : {{ pypy_check.stdout | default('NOT CHECKED') }}
            Rust    : {{ 'OK' if rust_check.rc == 0 else 'FAILED' }}
            Certs   : {{ 'OK' if cert_check.stat.exists else 'MISSING' }}
            Platform: {{ bench_platform }}
          ═══════════════════════════════════════════════════════
      tags: [always]
